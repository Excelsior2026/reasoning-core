[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-core"
version = "0.1.0"
description = "Universal reasoning extraction engine - Transform expertise into intelligent knowledge graphs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [
    {name = "Excelsior2026", email = "billparris@gmail.com"}
]
keywords = [
    "reasoning",
    "knowledge-graphs",
    "nlp",
    "concept-extraction",
    "ai",
    "machine-learning",
    "education",
    "training"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# The core engine only needs requests (Ollama LLM client). Everything the web
# layer needs lives in the optional `web` extra.
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.24.0",
    # Pinned to the versions in .pre-commit-config.yaml so local and CI
    # formatting/linting are deterministic.
    "black==23.12.1",
    "isort==5.13.2",
    "flake8==7.0.0",
    "mypy>=1.0.0",
]
web = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "beautifulsoup4>=4.12.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "aiofiles>=23.0.0",
    "pyjwt>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "reportlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Excelsior2026/reasoning-core"
Repository = "https://github.com/Excelsior2026/reasoning-core"
Issues = "https://github.com/Excelsior2026/reasoning-core/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.coverage.run]
# The web layer (src/reasoning_core/web) has no tests yet, so it is excluded
# from the coverage gate; the gate should measure code that is exercised.
# Remove this omit once web tests land.
omit = ["src/reasoning_core/web/*"]

[tool.coverage.report]
# Just below the currently measured core coverage (65.4%). Ratchet up as
# tests are added; do not lower it.
fail_under = 65
